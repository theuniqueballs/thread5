# THREAD 5 — непрерывная интеграция (инженерный апгрейд 2026-11-20;
# двойной аудит 2026-11-21: P1-06 production build, P0-06 индекс сдачи).
#
# Три работы на каждый пуш/PR:
#   web      — прилавок: типы (tsc), линт (eslint), юнит-тесты (bun test)
#              и production build (сборка падает на PR, не на проде);
#   pipeline — печь: юнит-тесты инструментов, валидатор спек (--ci),
#              гейты на свежайшей сданной партии (индекс сдачи, PASS обязателен);
#   shell    — smoke тестов сборок рантаймов (uv, без venv/docker).
#
# Философия та же, что у pre-commit: молчание гейтов исключено — но здесь
# проверяется ещё и то, что сами инструменты не сломались молча.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: прилавок (tsc · lint · bun test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установка зависимостей
        run: bun install --frozen-lockfile

      - name: Типы (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Линт (eslint)
        run: bun run lint

      - name: Юнит-тесты прилавка (parser/ystamp/inbox/store)
        run: bun test tests/unit

      # Двойной аудит 2026-11-20, P1-06: production build — не разовый
      # ручной прогон, а CI-контракт: сборка падает на PR, а не на проде.
      # 2026-11-23 (хирургия тройного вердикта): мёртвый Prisma-слой шаблона
      # вырезан — db:generate/DATABASE_URL больше не нужны (прилавку БД ни к чему).
      - name: Production build (16 роутов)
        run: bun run build

  pipeline:
    name: печь (unittest · validate · gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Юнит-тесты инструментов (gates/window/taste/oracle)
        run: python3 -m unittest discover -s tests/python -v

      - name: Самтест зеркала жребия (паритет прилавок↔печь↔сервис)
        run: python3 tools/oracle.py selftest

      - name: Валидатор спек (CI-режим, без проверки хука)
        run: python3 tools/validate.py --ci

      # 2026-11-23 (хирургия тройного вердикта): двоеточие в имени шага ломало YAML —
      # CI молча не работал с 2026-11-20 (Invalid workflow file на ЛЮБОМ триггере)
      - name: Гейты на свежайшей сданной партии (двойной аудит P0-06 — статус из индекса сдачи, не ls|sort — черновик не считается сданным)
        run: |
          latest=$(python3 tools/t5delivery.py latest)
          if [ -z "$latest" ]; then
            echo "нет сданных партий — пропуск"; exit 0
          fi
          echo "гейты: $latest"
          python3 tools/gates.py "$latest"

      - name: Станция окна — дымовой прогон (квитанция в stdout)
        run: python3 tools/window.py --depth 3 > /dev/null && echo "window OK"

      # ПРОТОКОЛ «ПРОБЫ И ОШИБОК» (2026-11-22): тест-горн в CI — болванки
      # PROTO-2 обязаны рождаться законными (законы В39–В43 инвариантны
      # в любом окружении); ролл внутри сам гоняет check и падает кодом
      - name: Тест-горн (roll + check PROTO-2, воспроизводимость)
        run: |
          python3 tools/testforge.py roll --n 21 --seed 4242 --exp 9
          python3 tools/testforge.py check --batch TB-$(date -u +%Y%m%d)-4242

  shell-smoke:
    name: сборки рантаймов (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2026-11-24 (SURGERY): smoke красная на всех прогонах CI с рождения —
      # python-runtime-build.sh требует uv (uv pip install/compile/export),
      # а в ubuntu-latest его нет (скрипт честно выходит с «构建环境中没有 uv»).
      # Ставим uv официальным экшеном; web/pipeline при этом зелёные.
      # ПИН v10.4.0 (не «v10»): у astral-sh/setup-uv нет тега-алиаса мажора —
      # только полные v10.x.x (прогон #17: unable to find version `v10`).
      - uses: astral-sh/setup-uv@v10.4.0

      # 2026-11-23: database-runtime-build вырезан вместе с мёртвым Prisma;
      # smoke теперь гоняет живой python-runtime-build (тот, что в build.sh)
      # 2026-11-24: имя честно про uv (было «fake-bun, без venv» — uv нужен
      # всегда, когда скрипт видит Python-источник или манифест)
      - name: python-runtime-build (uv, без venv)
        run: bash tests/python-runtime-build.sh
